name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on a GitHub-hosted runner. The repo is public, so a fork PR must never reach a self-hosted
# machine. `vp` comes from the vite-plus devDependency in node_modules/.bin, which npm scripts put on PATH.
jobs:
  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run knip

  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test

  # `npm run verify` builds, then drives the unpackaged Electron app in a hidden window. It takes about 10 minutes.
  verify:
    name: Verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Upload screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: verify-screenshots
          path: out/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # `npm run verify:web` checks in headless Chrome that the web demo build loads and onboarding finishes.
  verify-web:
    name: Verify web
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      # Same lookup as scripts/verify.mjs. The macos-15 image ships Google Chrome in /Applications.
      - name: Require Google Chrome
        run: |
          chrome="${CHROME_BIN:-/Applications/Google Chrome.app/Contents/MacOS/Google Chrome}"
          test -x "$chrome" || { echo "::error::Chrome not found at $chrome. Set CHROME_BIN."; exit 1; }
          "$chrome" --version
      - run: npm ci
      - run: npm run verify:web

  # `npm run smoke:packaged` packages the app unsigned, reads its fuses back, boots it, and checks it refuses a debugger.
  smoke-packaged:
    name: Packaged smoke
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run smoke:packaged

  # Branch protection on main requires this job by its name, `Check`. Add every new job to `needs`.
  # `always()` so a failed or cancelled dependency still produces a failing Check instead of a skip.
  check:
    name: Check
    if: ${{ always() }}
    needs: [lint, build, test, verify, verify-web, smoke-packaged]
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
