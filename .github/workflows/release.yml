name: Release

on:
  push:
    tags:
      - "v*"

# Uploads assets to a draft release. Kyle publishes it by hand.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: macos-15
    # Holds the signing and notarisation secrets. Only Kyle can approve a run.
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Require the tag to match package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      # Only this build checks GitHub Releases for updates: Squirrel.Mac installs one only over a signed app.
      - run: npm run build
        env:
          CONSTELLATION_UPDATES: "on"
      # notarytool and electron-builder both read the App Store Connect API key from a file.
      - name: Write the API key to a file
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      # electron-builder imports CSC_LINK into a temporary keychain, signs the apps with hardened runtime, notarises
      # and staples them, then builds the zips, latest-mac.yml and the DMGs, and signs the DMGs (`dmg.sign`).
      # It notarises only the apps, so the DMGs are notarised below, before anything is uploaded.
      - name: Package, sign and notarise the apps
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac --publish never
      - name: Check Gatekeeper accepts both apps
        run: |
          for app in out/release/mac-arm64/Constellation.app out/release/mac/Constellation.app; do
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID"
          done
      # Stapling rewrites each DMG. `dmg.writeUpdateInfo: false` keeps DMGs out of latest-mac.yml and gives them no
      # blockmap (electron-updater on macOS reads only the zip), so no metadata goes stale.
      - name: Notarise, staple and check both DMGs
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmgs=(out/release/Constellation-*.dmg)
          test "${#dmgs[@]}" -eq 2
          for dmg in "${dmgs[@]}"; do
            codesign --verify --strict --verbose=2 "$dmg"
            result=$(xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" --wait --output-format json)
            echo "$result"
            test "$(jq -r .status <<< "$result")" = Accepted
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" 2>&1 \
              | tee /dev/stderr | grep -q "source=Notarized Developer ID"
          done
      # The runner is Apple silicon, so this boots the signed arm64 app.
      - run: node scripts/smoke-packaged.mjs
      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            out/release/Constellation-*.dmg out/release/Constellation-*.zip out/release/Constellation-*.zip.blockmap \
            out/release/latest-mac.yml
