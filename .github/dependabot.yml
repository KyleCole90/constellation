version: 2
updates:
  # Electron and vite-plus update in their own PRs: an Electron major is never buried in a group, and docs/adr/0014 says why vite-plus is apart.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        exclude-patterns: ["electron", "vite-plus"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
